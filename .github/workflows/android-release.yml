name: Android Build & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Fix gradlew Line Endings & Permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Android Lint Checks
        run: ./gradlew lintDebug

      - name: Setup Signing Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Successfully decoded keystore from repository secret."
          else
            echo "No KEYSTORE_BASE64 secret found. Generating valid release keystore on runner."
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias personalvault -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "android" -keypass "android" \
              -dname "CN=PersonalVault, OU=Vault, O=PersonalVault, L=City, S=State, C=US"
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=personalvault" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE_PATH: app/release.keystore
        run: ./gradlew assembleRelease

      - name: Prepare APK Asset
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found generated APK: $APK_FILE"
            cp "$APK_FILE" "PersonalVault-${TAG_NAME}.apk"
          else
            echo "Error: No APK found in release directory."
            exit 1
          fi

      - name: Create GitHub Release & Upload APK Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: PersonalVault-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
